<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opal & Oak</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f2ec;color:#171513;font-family:Arial,sans-serif}.top{background:#171513;color:#fff;text-align:center;padding:8px;font-size:11px;letter-spacing:2px}nav{height:70px;background:#fffdf9;border-bottom:1px solid #e5ddd4;display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:5}.brand{font:28px Georgia,serif}button{border:0;border-radius:10px;padding:11px 16px;background:#171513;color:#fff;cursor:pointer}.hero{max-width:1180px;margin:25px auto;padding:60px 6%;border-radius:24px;background:linear-gradient(120deg,#e5d8c9,#fffaf3);display:grid;grid-template-columns:1.2fr .8fr;gap:30px}h1{font:58px Georgia,serif;line-height:1;margin:15px 0}.hero p{color:#756e67;line-height:1.7}.heroart{min-height:270px;border-radius:20px;background:linear-gradient(145deg,#c7b49f,#705b47);display:flex;align-items:end;padding:25px;color:#fff;font:20px Georgia,serif}.section{max-width:1180px;margin:45px auto;padding:0 6%}h2{font:36px Georgia,serif}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filter{background:#fff;color:#171513;border:1px solid #e5ddd4;border-radius:99px}.filter.on{background:#171513;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fffdf9;border:1px solid #e5ddd4;border-radius:16px;overflow:hidden}.pic{aspect-ratio:1;background:#e8ded4;display:flex;align-items:center;justify-content:center;font-size:60px}.body{padding:15px}.body h3{font:20px Georgia,serif;margin:5px 0}.muted{color:#756e67;font-size:13px;line-height:1.5}.price{font-weight:bold;margin:12px 0}.card button{width:100%}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.box{background:#fffdf9;border-radius:18px;padding:24px;width:min(650px,100%);max-height:90vh;overflow:auto}.close{float:right;border-radius:50%;padding:7px 11px}.field{margin:12px 0}label{display:block;font-size:12px;color:#756e67;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #e5ddd4;border-radius:8px}textarea{min-height:90px}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:40px 6%}h1{font-size:43px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://yxfiifavyklplkqiudcr.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4ZmlpZmF2eWtscGxrcWl1ZGNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MTQwNjMsImV4cCI6MjEwNTI5MDA2M30.ELYZQt-nyyQLOZEomO781HMEpFYORKuXqLgs5yxM_lY");
let products=[],cart=JSON.parse(localStorage.getItem("oo_cart")||"[]"),cat="All";
const money=n=>"PKR "+Number(n).toLocaleString("en-PK");
async function load(){let r=await supabase.from("products").select("*").eq("active",true).order("created_at",{ascending:false});products=r.data||[];render();}
function render(){app.innerHTML=`<div class="top">OPAL & OAK · MODERN ESSENTIALS</div><nav><div class="brand">Opal & Oak</div><div><button onclick="bag()">Bag (<span id="count">${cart.reduce((a,x)=>a+x.qty,0)}</span>)</button> <button onclick="login()">Admin</button></div></nav><section class="hero"><div><div class="muted">CURATED ESSENTIALS</div><h1>Quiet luxury, made for everyday.</h1><p>Thoughtfully selected pieces with a modern premium character.</p><button onclick="shop.scrollIntoView({behavior:'smooth'})">Shop collection</button></div><div class="heroart">OPAL & OAK<br>Curated essentials</div></section><section class="section" id="shop"><div class="muted">THE COLLECTION</div><h2>Shop</h2><div class="filters" id="filters"></div><div class="grid" id="grid"></div></section>`;draw();}
function draw(){let cs=["All",...new Set(products.map(p=>p.category).filter(Boolean))];filters.innerHTML=cs.map(c=>`<button class="filter ${c==cat?"on":""}" onclick="setCat('${c}')">${c}</button>`).join("");let ps=products.filter(p=>cat=="All"||p.category==cat);grid.innerHTML=ps.length?ps.map(p=>`<article class="card"><div class="pic">${p.image_url?`<img src="${p.image_url}" style="width:100%;height:100%;object-fit:cover">`:"✦"}</div><div class="body"><div class="muted">${p.category||""}</div><h3>${p.name}</h3><div class="muted">${p.description||""}</div><div class="price">${money(p.price)}</div><button onclick="add('${p.id}')">Add to bag</button></div></article>`).join(""):"<p>No products available.</p>";}
window.setCat=c=>{cat=c;draw()};window.add=id=>{let x=cart.find(x=>x.id==id);x?x.qty++:cart.push({id,qty:1});localStorage.setItem("oo_cart",JSON.stringify(cart));count.textContent=cart.reduce((a,x)=>a+x.qty,0)};
function modal(s){let d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="box"><button class="close" onclick="this.closest('.modal').remove()">×</button>${s}</div>`;document.body.append(d)}
window.bag=()=>{let it=cart.map(x=>({...x,p:products.find(p=>p.id==x.id)})).filter(x=>x.p),t=it.reduce((a,x)=>a+x.p.price*x.qty,0);modal(`<h2>Your Bag</h2>${it.map(x=>`<p>${x.p.name} × ${x.qty} — ${money(x.p.price*x.qty)}</p>`).join("")||"<p>Your bag is empty.</p>"}<h3>Total: ${money(t)}</h3>${it.length?'<button onclick="checkout()">Checkout</button>':""}`)}
window.checkout=()=>modal(`<h2>Checkout</h2><form onsubmit="place(event)"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Address</label><textarea name="address" required></textarea></div><button>Place order</button></form>`);
window.place=async e=>{e.preventDefault();let f=new FormData(e.target),items=cart.map(x=>{let p=products.find(p=>p.id==x.id);return {product_id:p.id,name:p.name,qty:x.qty,price:p.price}}),total=items.reduce((a,x)=>a+x.price*x.qty,0);let r=await supabase.from("orders").insert({customer_name:f.get("name"),customer_phone:f.get("phone"),customer_email:f.get("email"),address:f.get("address"),items,total,payment_method:"COD",status:"Pending"});if(r.error)return alert(r.error.message);cart=[];localStorage.setItem("oo_cart","[]");alert("Order placed successfully");location.reload();}
window.login=()=>modal(`<h2>Admin Login</h2><form onsubmit="signin(event)"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button>Sign in</button></form>`);
window.signin=async e=>{e.preventDefault();let f=new FormData(e.target),r=await supabase.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(r.error)alert(r.error.message);else location.href=location.pathname+"?admin=1"};load();
</script></body></html>
